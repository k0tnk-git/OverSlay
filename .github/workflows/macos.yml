name: macOS Build
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md', 'docs/reference/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/reference/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate
        run: bash scripts/ci.sh
      - name: Upload application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OverSlay-macOS-${{ github.sha }}
          path: |
            dist/OverSlay-macOS-universal.zip
            dist/OverSlay-macOS-universal.dmg
            dist/SHA256SUMS.txt
            dist/READ-ME-FIRST.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics-${{ github.sha }}
          path: build/*.txt
          if-no-files-found: warn
          retention-days: 7

  launch-smoke:
    name: Launch packaged app (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download packaged application
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "OverSlay-macOS-$GITHUB_SHA" --dir dist
      - name: Test ZIP round-trip and launch
        run: |
          mkdir -p build/unpacked
          ditto -x -k dist/OverSlay-macOS-universal.zip build/unpacked
          bash scripts/launch-smoke.sh "$PWD/build/unpacked/OverSlay.app" build/zip-launch.txt
      - name: Test DMG install and launch
        run: |
          mkdir -p build/mount build/installed
          hdiutil attach dist/OverSlay-macOS-universal.dmg -nobrowse -readonly -mountpoint "$PWD/build/mount"
          trap 'hdiutil detach "$PWD/build/mount"' EXIT
          ditto build/mount/OverSlay.app build/installed/OverSlay.app
          bash scripts/launch-smoke.sh "$PWD/build/installed/OverSlay.app" build/dmg-launch.txt
      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-diagnostics-${{ matrix.os }}-${{ github.sha }}
          path: build/*launch.txt
          if-no-files-found: warn
          retention-days: 14
